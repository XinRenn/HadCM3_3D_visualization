<meta name="description" content="A plain-language tour of how the climate model HadCM3 works, in eight short chapters on a globe drawn from the model's own data. Works in a browser or a VR headset.">

<style>
/* Layout: the globe is the page. One short caption beside it, eight chapters along the bottom.
   One dark world, like the planetarium of the full v3 page, so a single theme; larger type for a room or a projector. */
:root {
  --space: #060B11;
  --panel: #0C141B;
  --raise: #15222C;
  --line: #2A3D4B;
  --ink: #EEF3F4;
  --muted: #A6B5BC;
  --faint: #76878F;
  --accent: #E7B04C;
  --air: #6FAEE0;
  --sea: #35B6C2;
  --font-display: "Source Serif 4", "Noto Serif SC", Georgia, "Songti SC", serif;
  --font-body: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --side: max(16px, env(safe-area-inset-left, 0px));
  --side-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--space); color: var(--ink); font: 17px/1.65 var(--font-body); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.main { position: relative; min-height: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }

.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 14px; line-height: 1.25; font-weight: 500;
  padding: 3px 8px; border-radius: 4px; background: rgba(6, 11, 17, 0.8); border-left: 3px solid var(--air);
}
.lbl.sea { border-left-color: var(--sea); }
.lbl.uk { border-left-color: var(--accent); }

.tools {
  position: absolute; z-index: 3; top: 12px; right: var(--side-r); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.tbtn {
  height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: rgba(12, 20, 27, 0.85);
  cursor: pointer; font-size: 14px; color: var(--ink); display: inline-flex; align-items: center;
}
.tbtn:hover { border-color: var(--muted); }
.tbtn.vr { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: rgba(12, 20, 27, 0.85); }
.lang button { height: 32px; padding: 0 11px; border: 0; background: transparent; cursor: pointer; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
.about {
  position: absolute; z-index: 3; top: 54px; right: var(--side-r); width: min(380px, calc(100% - 32px)); padding: 14px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; line-height: 1.55; color: var(--muted);
}
.about p { margin: 0; }
.about p + p { margin-top: 8px; }
.about b { color: var(--ink); font-weight: 600; }

.story {
  position: absolute; z-index: 2; left: var(--side); top: 50%; transform: translateY(-50%);
  width: min(430px, 36vw); max-height: calc(100% - 24px); overflow-y: auto; display: grid; gap: 14px; padding-block: 8px;
}
.brand { font: 500 13px/1 var(--font-mono); color: var(--accent); letter-spacing: 0.06em; }
.story h1 { margin: 0; font: 600 clamp(29px, 3vw, 42px)/1.2 var(--font-display); text-wrap: balance; }
.story .body { margin: 0; color: var(--ink); }
.story .note { margin: 0; font-size: 14px; line-height: 1.5; color: var(--faint); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat b { display: block; font: 600 30px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.stat.air b { color: var(--air); }
.stat.sea b { color: var(--sea); }
.stat span { display: block; font-size: 14px; line-height: 1.35; color: var(--muted); }

.legend { display: grid; gap: 4px; max-width: 340px; }
.legend .lt { font-size: 14px; color: var(--muted); }
.legend .bar { height: 12px; border-radius: 3px; }
.legend .ticks { position: relative; height: 20px; font: 500 13px/20px var(--font-mono); color: var(--muted); }
.legend .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend .ticks span:first-child { transform: none; }
.legend .ticks span:last-child { transform: translateX(-100%); }
.cats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.cats span { display: inline-flex; align-items: center; gap: 6px; }
.cats i { width: 12px; height: 12px; border-radius: 3px; flex: none; }

.relay { display: grid; gap: 8px; }
.relay .state { font-size: 16px; font-weight: 600; min-height: 1.65em; }
.relay .state small { font: 500 13px var(--font-mono); color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.relay .track { display: flex; gap: 6px; align-items: stretch; height: 28px; }
.relay .run { position: relative; border-radius: 4px; background: var(--raise); overflow: hidden; min-width: 0; }
.relay .run i { position: absolute; inset: 0 auto 0 0; width: 0; }
.relay .run.a { flex: 48; } .relay .run.a i { background: var(--air); }
.relay .run.o { flex: 24; } .relay .run.o i { background: var(--sea); }
.relay .run.s { flex: 7; } .relay .run.s i { background: var(--accent); }
.relay .keys { display: flex; gap: 6px; font-size: 13px; color: var(--muted); }
.relay .keys span { min-width: 0; white-space: nowrap; }
.relay .keys .a { flex: 48; } .relay .keys .o { flex: 24; } .relay .keys .s { flex: 7; text-align: center; color: var(--accent); }

.nav {
  display: flex; align-items: center; gap: 10px; background: var(--panel); border-top: 1px solid var(--line); z-index: 4;
  padding: 8px var(--side-r) calc(8px + env(safe-area-inset-bottom, 0px)) var(--side);
}
.tabs { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab {
  flex: 1 1 0; min-width: fit-content; position: relative; height: 42px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden;
}
.tab:hover { color: var(--ink); background: var(--raise); }
.tab.cur { color: var(--ink); background: var(--raise); font-weight: 600; }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
.tab.done::after, .tab.cur::after { background: var(--accent); }
.tab .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: #FFE6A8; z-index: 1; }
.ctl { height: 42px; min-width: 42px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; font-size: 15px; white-space: nowrap; }
.ctl:hover { border-color: var(--muted); }
.ctl:disabled { opacity: 0.35; cursor: default; }
.ctl.next { background: var(--accent); border-color: var(--accent); color: #1D1505; font-weight: 600; }
.ctl.next:disabled { background: var(--raise); border-color: var(--line); color: var(--ink); }
.ctl[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; background: var(--space); z-index: 5; color: var(--muted); text-align: center; padding: 16px; }
.loading .spin { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot 0.9s linear infinite; }
.loading.err .spin { display: none; }
@keyframes rot { to { transform: rotate(360deg); } }

@media (max-width: 820px) {
  html, body { height: auto; }
  body { overflow: auto; }
  .app { position: static; display: flex; flex-direction: column; min-height: 100svh; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .stage { position: relative; inset: auto; flex: none; height: 50svh; min-height: 300px; }
  .story { position: static; transform: none; width: auto; max-height: none; overflow: visible; flex: 1; padding: 14px var(--side-r) 18px var(--side); }
  .story h1 { font-size: 27px; }
  .nav { position: sticky; bottom: 0; flex-wrap: wrap; gap: 8px; }
  .tabs { order: -1; flex: 1 0 100%; }
  .tab { height: 36px; padding: 0 10px; font-size: 14px; }
  .ctl { flex: 1; height: 40px; }
  .lbl { font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) { .loading .spin { animation: none; } }
</style>

</div>

<script type="module">
import * as THREE from 'three';

/* ================================================================ helpers */
const ST = window.EARTH_DATA;
const D2R = Math.PI / 180;
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrap360 = x => ((x % 360) + 360) % 360;
const hex3 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private window */ } } };

let LANG = store.get('earth-lang') || ((navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');
const tx = o => o[LANG];
const L = (zh, en) => ({ zh, en });

/* ================================================================ the words */
const U = {
  title: L('把地球装进电脑', 'Earth in a Computer'),
  prev: L('上一章', 'Back'), next: L('下一章', 'Next'), again: L('重新开始', 'Start over'),
  auto: L('自动播放', 'Autoplay'), stop: L('停止播放', 'Stop'),
  about: L('关于数据', 'About the data'), vr: L('进入 VR', 'Enter VR'), load: L('正在载入模型数据', 'Loading model data'),
  fail: L('页面无法载入地球。请检查网络后刷新，并确认浏览器支持 WebGL。', 'The globe could not load. Check your connection, reload, and make sure the browser supports WebGL.'),
  aboutBody: L(
    '<p><b>HadCM3</b> 是英国气象局哈德利中心开发的气候模型。这里画的是它算出的工业革命前气候（CO₂ 约 280 ppm）。</p><p>数据来自布里斯托大学 BRIDGE 团队的一组 HadCM3 起始场：海温、海冰和风是 12 月 1 日的状态，气温、云和雨是 11 月平均，海流也是 11 月平均。</p><p>模型并没有在你的浏览器里运行。页面只是把存下的结果画出来，流动的线条是沿着存下的风场和海流场走的示意，速度经过放大。</p>',
    '<p><b>HadCM3</b> is a climate model from the UK Met Office Hadley Centre. This page shows the pre-industrial climate it calculates (CO₂ about 280 ppm).</p><p>The data are a HadCM3 start state used by the BRIDGE group at the University of Bristol. Sea temperature, sea ice and winds are the state on 1 December. Air temperature, clouds, rain and ocean currents are November averages.</p><p>The model is not running in your browser. The page draws stored results, and the moving lines follow the stored winds and currents at an exaggerated speed.</p>'),

  if (kind === 'rain') return bar(LANG === 'zh' ? '降水量（毫米 / 天）' : 'Rain and snow (mm per day)', RAIN_COLS, [[0, '0'], [rainPos(4), '4'], [rainPos(9), '9'], [1, '25']]);

    const it = [['#2E6B34', L('森林', 'Forest')], ['#8FB35A', L('草地', 'Grass')], ['#C8A874', L('荒漠', 'Desert')], ['#F2F6FA', L('冰雪', 'Ice and snow')], ['#14507C', L('海洋', 'Ocean')]];
    return `<div class="cats">${it.map(([c, n]) => `<span><i style="background:${c}"></i>${tx(n)}</span>`).join('')}</div>`;
  }
  return '';
}
function relayHTML() {
  return `<div class="relay"><div class="state" id="rState"></div>
    <div class="track"><div class="run a"><i id="rA"></i></div><div class="run s"><i id="rS1"></i></div><div class="run o"><i id="rO"></i></div><div class="run s"><i id="rS2"></i></div></div>
    <div class="keys"><span class="a">${tx(U.kA)}</span><span class="s">${tx(U.kS)}</span><span class="o">${tx(U.kO)}</span><span class="s"></span></div></div>`;
}
function render() {
  const c = CH[STATE.ch];
  document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
  document.title = tx(U.title);
  $('#story').innerHTML = `<div class="brand">HadCM3 · ${STATE.ch + 1} / ${CH.length}</div><h1>${tx(c.h)}</h1><p class="body">${tx(c.b)}</p>`
    + (c.stats ? `<div class="stats">${c.stats.map(([k, n, s]) => `<div class="stat ${k}"><b>${n}</b><span>${tx(s)}</span></div>`).join('')}</div>` : '')
    + (c.legend ? legendHTML(c.legend) : '') + (c.relay ? relayHTML() : '') + (c.n ? `<p class="note">${tx(c.n)}</p>` : '');
  $('#tabs').innerHTML = CH.map((x, i) => `<button type="button" class="tab${i === STATE.ch ? ' cur' : i < STATE.ch ? ' done' : ''}" data-i="${i}"${i === STATE.ch ? ' aria-current="step"' : ''}>${tx(x.nav)}<span class="fill"></span></button>`).join('');
  $('#btnPrev').textContent = tx(U.prev); $('#btnPrev').disabled = STATE.ch === 0;
  $('#btnNext').textContent = STATE.ch === CH.length - 1 ? tx(U.again) : tx(U.next);
  $('#btnAbout').textContent = tx(U.about); $('#about').innerHTML = tx(U.aboutBody);
  $('#btnVR').textContent = tx(U.vr);
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  setLabel('air', tx(U.c19), 'air'); setLabel('sea', tx(U.c20), 'sea'); setLabel('uk', tx(U.cUK), 'uk');
  renderAuto();
  if (c.relay) RELAY.phase = '';
  drawPanel();
}

/* ================================================================ the relay chapter */
function relayTick(dt) {
  RELAY.t += dt;
  if (RELAY.t >= R_DAY) { RELAY.t -= R_DAY; RELAY.day++; RELAY.phase = ''; }
  const t = RELAY.t, a2o = t >= R_ATM && t < R_ATM + R_SWAP, ocn = t >= R_ATM + R_SWAP && t < R_ATM + R_SWAP + R_OCN, o2a = t >= R_ATM + R_SWAP + R_OCN;
  const phase = a2o ? 'a2o' : ocn ? 'ocn' : o2a ? 'o2a' : 'atm';
  let i = 0, n = 0, f = 0;
  if (phase === 'atm') { n = 48; f = t / R_ATM; i = Math.min(47, Math.floor(f * 48)) + 1; }
  if (phase === 'ocn') { n = 24; f = (t - R_ATM - R_SWAP) / R_OCN; i = Math.min(23, Math.floor(f * 24)) + 1; }
  if (phase !== RELAY.phase) {
    RELAY.phase = phase;
    if (phase === 'atm') { setSurf('natural'); Object.assign(TGT, { wind: 1, cur: 0, rain: 0, clouds: 0.55, glow: 1.05 }); }
    if (phase === 'a2o') { DROPS.setMode('down'); Object.assign(TGT, { wind: 0.15, cur: 0, rain: 1, clouds: 0.25, glow: 0.75 }); }
    if (phase === 'ocn') { setSurf('sst'); Object.assign(TGT, { wind: 0, cur: 1, rain: 0, clouds: 0, glow: 0.45 }); }
    if (phase === 'o2a') { DROPS.setMode('up'); Object.assign(TGT, { wind: 0, cur: 0.15, rain: 1, clouds: 0.1, glow: 0.75 }); }
    drawPanel();
  }
  const el = $('#rState');
  if (el) {
    const name = tx(phase === 'atm' ? U.sAtm : phase === 'ocn' ? U.sOcn : phase === 'a2o' ? U.sA2O : U.sO2A);
    const stepTxt = n ? tx(U.step).replace('{i}', i).replace('{n}', n) + ' · ' : '';
    const html = `${name}<small>${stepTxt}${tx(U.day).replace('{d}', RELAY.day)}</small>`;
    if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; }
    const pct = (id, x) => { $(id).style.width = (clamp(x, 0, 1) * 100).toFixed(1) + '%'; };
    pct('#rA', t / R_ATM); pct('#rS1', (t - R_ATM) / R_SWAP); pct('#rO', (t - R_ATM - R_SWAP) / R_OCN); pct('#rS2', (t - R_ATM - R_SWAP - R_OCN) / R_SWAP);
  }
}

/* ================================================================ layout */
let OFFSET = 0;
function resize() {
  const W = Math.max(stage.clientWidth, 1), H = Math.max(stage.clientHeight, 1);
  if (renderer.xr.isPresenting) return;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  const wide = window.innerWidth > 820;
  /* the globe sits right of the caption on a wide screen */
  OFFSET = wide ? Math.min(0.19 * W, 0.5 * (Math.min(430, 0.36 * W))) + 8 : 0;
  const availW = W - (wide ? 2 * OFFSET + 40 : 24), availH = H - (wide ? 46 : 24);
  const fit = Math.min(availW / W * camera.aspect, availH / H), tanH = Math.tan(camera.fov * D2R / 2);
  camera.position.z = 1.34 / (tanH * fit);
  if (OFFSET) camera.setViewOffset(W, H, -OFFSET, 0, W, H); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  DROPS.px = (wide ? 15 : 11) * renderer.getPixelRatio(); DROPS.mat.uniforms.uPx.value = DROPS.px * (DROPS.mode === 'rain' ? 1 : 1.9);
}

/* ================================================================ frame */
const WORLD_LIGHT = new THREE.Vector3(-0.45, 0.42, 0.8).normalize();
const INVQ = new THREE.Quaternion(), V_SUN = new THREE.Vector3();
function damp(a, b, dt, rate = 3.5) { return lerp(a, b, 1 - Math.exp(-rate * dt)); }
function angDamp(a, b, dt, rate) { const d = ((b - a + 540) % 360) - 180; return a + d * (1 - Math.exp(-rate * dt)); }
let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016); lastT = now;
  const c = CH[STATE.ch], adt = REDUCED ? 0 : dt, vr = renderer.xr.isPresenting;
  if (vr) vrInput(dt);

  /* view: drag offsets on top of the chapter's own view */
  if (c.spin && !VIEW.drag && !REDUCED) VIEW.tLon = wrap360(VIEW.tLon - dt * 5);
  let sun = null;
  if (c.sun) {
    MODEL_H = (MODEL_H + adt * 24 / 15) % 24;
    setDiurnal();
    sun = sunAt(MODEL_H);
    VIEW.tLon = wrap360(sun.lon - 52);
  }
  VIEW.lat = damp(VIEW.lat, clamp(VIEW.tLat + VIEW.dLat, -82, 82), dt, REDUCED ? 60 : 2.4);
  VIEW.lon = angDamp(VIEW.lon, wrap360(VIEW.tLon + VIEW.dLon), dt, REDUCED ? 60 : (c.sun && U_GLOBE.uFade.value >= 1 ? 8 : 2.4));
  earth.rotation.set(VIEW.lat * D2R, (-90 - VIEW.lon) * D2R, 0);

  /* blend everything toward this chapter */
  for (const k in TGT) NOW[k] = REDUCED ? TGT[k] : damp(NOW[k], TGT[k], dt);
  if (U_GLOBE.uFade.value < 1) U_GLOBE.uFade.value = Math.min(1, U_GLOBE.uFade.value + dt / 0.9);
  cloudMat.uniforms.uAlpha.value = NOW.clouds;
  U_GLOBE.uGrid.value = NOW.grid; U_GLOBE.uNight.value = NOW.night; U_GLOBE.uBright.value = NOW.bright; U_GLOBE.uWarm.value = NOW.warm;
  haloMat.uniforms.uGlow.value = NOW.glow;
  FLOW.wind.alpha = NOW.wind; FLOW.cur.alpha = NOW.cur; DROPS.alpha = NOW.rain;
  if (FLOW.wind.mesh.visible && adt) FLOW.wind.step(adt);
  if (FLOW.cur.mesh.visible && adt) FLOW.cur.step(adt);
  if (DROPS.mesh.visible) DROPS.step(adt);

  /* the light: the real Sun in one chapter, a soft fixed light otherwise */
  earth.updateMatrixWorld(); INVQ.copy(earth.quaternion).invert();
  V_SUN.copy(WORLD_LIGHT).applyQuaternion(INVQ);
  if (sun) V_SUN.lerp(sun.v, NOW.sun).normalize();
  U_GLOBE.uSun.value.copy(V_SUN);
  sunSprite.material.opacity = NOW.sun;
  sunSprite.visible = NOW.sun > 0.01;
  if (sun) { sunSprite.position.copy(sun.v).applyQuaternion(earth.quaternion).multiplyScalar(1.72); }

  /* the column rises slab by slab */
  if (COLUMN.t !== COLUMN.target) {
    COLUMN.t = REDUCED ? COLUMN.target : (COLUMN.target > COLUMN.t ? Math.min(1, COLUMN.t + dt / 2.2) : Math.max(0, COLUMN.t - dt / 0.5));
    writeColumn();
  }
  if (c.relay) relayTick(adt);

  /* autoplay */
  if (STATE.auto) {
    STATE.autoT += dt;
    const dur = c.relay ? R_DAY * 2 : 15;
    const fill = document.querySelector('.tab.cur .fill'); if (fill) fill.style.width = clamp(STATE.autoT / dur * 100, 0, 100).toFixed(1) + '%';
    if (STATE.autoT >= dur) show((STATE.ch + 1) % CH.length);
  } else { const fill = document.querySelector('.tab.cur .fill'); if (fill && fill.style.width) fill.style.width = ''; }

  placeLabels();
  renderer.render(scene, camera);
}

/* ================================================================ controls */
function bindControls() {
  $('#btnNext').onclick = () => show((STATE.ch + 1) % CH.length, { user: true });
  $('#btnPrev').onclick = () => show(STATE.ch - 1, { user: true });
  $('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) show(+b.dataset.i, { user: true }); };
  $('#btnAuto').onclick = () => { STATE.auto = !STATE.auto; STATE.autoT = 0; renderAuto(); };
  $('#btnAbout').onclick = () => { const a = $('#about'); a.hidden = !a.hidden; $('#btnAbout').setAttribute('aria-expanded', String(!a.hidden)); };
  document.querySelectorAll('.lang button').forEach(b => { b.onclick = () => { LANG = b.dataset.lang; store.set('earth-lang', LANG); render(); }; });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') show(Math.min(STATE.ch + 1, CH.length - 1), { user: true });
    if (e.key === 'ArrowLeft') show(STATE.ch - 1, { user: true });
  });
  window.addEventListener('hashchange', () => { const i = CH.findIndex(c => '#' + c.key === location.hash); if (i >= 0 && i !== STATE.ch) show(i, { fromHash: true }); });
  let px = 0, py = 0;
  canvas.addEventListener('pointerdown', e => { VIEW.drag = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); stopAuto(); });
  canvas.addEventListener('pointermove', e => {
    if (!VIEW.drag) return;
    const k = 0.28 * Math.min(1, 700 / Math.max(stage.clientHeight, 300));
    VIEW.dLon -= (e.clientX - px) * k; VIEW.dLat = clamp(VIEW.dLat + (e.clientY - py) * k, -100, 100); px = e.clientX; py = e.clientY;
  });
  const up = () => { VIEW.drag = false; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
}

/* ================================================================ VR: the globe in front of you, a caption beneath it, two buttons */
let panel, panelCtx, panelTex;
function wrapText(g, text, x, y, maxW, lh) {
  const cjk = /[　-鿿＀-￯]/.test(text), parts = cjk ? Array.from(text) : text.split(' ');
  let line = '';
  for (const p of parts) {
    const test = line + (cjk || !line ? '' : ' ') + p;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); y += lh; line = p; } else line = test;
  }
  if (line) g.fillText(line, x, y);
  return y + lh;
}
function drawPanel() {
  if (!panel || !panel.visible) return;
  const g = panelCtx, W = 1280, H = 640, c = CH[STATE.ch], sans = '"Noto Sans SC", "IBM Plex Sans", system-ui, sans-serif';
  g.clearRect(0, 0, W, H);
  g.fillStyle = 'rgba(12,20,27,0.92)'; g.fillRect(0, 0, W, H);
  g.textBaseline = 'top'; g.fillStyle = '#E7B04C'; g.font = `500 30px ${sans}`;
  g.fillText(`HadCM3 · ${STATE.ch + 1} / ${CH.length}`, 48, 36);
  g.fillStyle = '#EEF3F4'; g.font = `600 58px ${sans}`;
  let y = wrapText(g, tx(c.h), 48, 84, W - 96, 70);
  g.font = `400 34px ${sans}`; g.fillStyle = '#DDE5E8';
  y = wrapText(g, tx(c.b), 48, y + 14, W - 96, 47);
  if (c.relay && RELAY.phase) {
    g.fillStyle = '#E7B04C'; g.font = `600 34px ${sans}`;
    wrapText(g, tx(RELAY.phase === 'atm' ? U.sAtm : RELAY.phase === 'ocn' ? U.sOcn : RELAY.phase === 'a2o' ? U.sA2O : U.sO2A), 48, H - 110, W - 96, 44);
  }
  g.fillStyle = '#76878F'; g.font = `400 26px ${sans}`;
  g.fillText(tx(U.vrHint), 48, H - 54);
  panelTex.needsUpdate = true;
}
function buildVR() {
  const c = document.createElement('canvas'); c.width = 1280; c.height = 640;
  panelCtx = c.getContext('2d');
  panelTex = new THREE.CanvasTexture(c);
  panel = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.5), new THREE.MeshBasicMaterial({ map: panelTex, transparent: true }));
  panel.visible = false; scene.add(panel);
  const onSelect = hand => { if (hand === 'left') show(STATE.ch - 1); else show((STATE.ch + 1) % CH.length); };
  for (let i = 0; i < 2; i++) {
    const ctl = renderer.xr.getController(i); let hand = 'right';
    ctl.addEventListener('connected', e => { hand = e.data.handedness; });
    ctl.addEventListener('selectstart', () => onSelect(hand));
    scene.add(ctl);
  }
  const btn = $('#btnVR');
  if (!navigator.xr || !navigator.xr.isSessionSupported) return;
  navigator.xr.isSessionSupported('immersive-vr').then(ok => { btn.hidden = !ok; }).catch(() => {});
  btn.onclick = async () => {
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'hand-tracking'] });
      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(s);
    } catch (e) { btn.textContent = String(e.message || e).slice(0, 60); }
  };
  renderer.xr.addEventListener('sessionstart', () => {
    world.scale.setScalar(0.34); world.position.set(0, 1.35, -1.0);
    panel.position.set(0, 0.72, -0.8); panel.rotation.x = -0.45; panel.visible = true; drawPanel();
    DROPS.px = 16; DROPS.mat.uniforms.uPx.value = DROPS.px * (DROPS.mode === 'rain' ? 1 : 1.9); stopAuto();
  });
  renderer.xr.addEventListener('sessionend', () => {
    world.scale.setScalar(1); world.position.set(0, 0, 0); panel.visible = false; camera.position.set(0, 0, 5); resize();
  });
}
function vrInput(dt) {
  const s = renderer.xr.getSession(); if (!s) return;
  for (const src of s.inputSources) {
    if (src.handedness !== 'right' || !src.gamepad || src.gamepad.axes.length < 4) continue;
    const ax = src.gamepad.axes[2], ay = src.gamepad.axes[3];
    if (Math.abs(ax) > 0.15) VIEW.dLon += ax * dt * 70;
    if (Math.abs(ay) > 0.15) VIEW.dLat = clamp(VIEW.dLat + ay * dt * 50, -100, 100);
  }
}

/* ================================================================ start */
async function main() {
  try {
    render0();
    await loadData();
    initBase();
    buildScene();
    buildFlows();
    DROPS = new Drops(1900);
    buildColumn();
    buildVR();
    bindControls();
    const i = CH.findIndex(c => '#' + c.key === location.hash);
    STATE.ch = Math.max(i, 0);
    const c0 = CH[STATE.ch];
    VIEW.lat = c0.view[0]; VIEW.lon = c0.view[1];
    resize();
    show(STATE.ch, { fromHash: true });
    if (c0.surf !== 'natural') U_GLOBE.uFade.value = 1;
    Object.assign(NOW, TGT);
    $('#loading').hidden = true;
    renderer.setAnimationLoop(frame);
  } catch (e) {
    console.error(e);
    const l = $('#loading'); l.classList.add('err'); $('#loadMsg').textContent = tx(U.fail);
  }
}
function render0() { document.title = tx(U.title); $('#loadMsg').textContent = tx(U.load); }
main();
</script>
