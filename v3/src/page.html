<title>HadCM3 in 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="HadCM3 (UM vn4.5) stepping through one coupled day on a 3D globe: each routine in call order on the model's own grids, with real fields from a pre-industrial start dump.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
@@CSS@@
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand">
      <h1>HadCM3 <span>3D</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tools">
      <button type="button" class="tbtn" id="btnLayers" aria-controls="layers" aria-expanded="true"></button>
      <button type="button" class="tbtn" id="btnHome"></button>
      <button type="button" class="tbtn" id="btnSpin" aria-pressed="false"></button>
      <a class="tbtn xlink" id="lnkV2" target="_blank" rel="noopener"></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <aside class="layers" id="layers" aria-label="Layers"></aside>

  <main class="stage" id="stage">
    <canvas id="gl" aria-label="3D globe"></canvas>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="hud" id="hud"></div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="loading" id="loading"><div class="spin"></div><p id="loadMsg">Loading HadCM3 fields…</p></div>
  </main>

  <section class="panel" id="panel" aria-live="polite"></section>

  <footer class="timeline" id="timeline">
    <div class="tl-row tl-ctrl">
      <div class="transport">
        <button type="button" class="tc" id="btnPrev"></button>
        <button type="button" class="tc play" id="btnPlay"></button>
        <button type="button" class="tc" id="btnNext"></button>
        <label class="speed"><span id="lblSpeed"></span>
          <select id="selSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </label>
        <label class="chk"><input type="checkbox" id="chkDetail"><span id="lblDetail"></span></label>
      </div>
      <div class="clockline" id="clockline"></div>
    </div>
    <div class="tl-row"><div class="day" id="day"></div></div>
    <div class="tl-row"><div class="chips" id="chips"></div></div>
  </footer>
</div>

@@APP@@
