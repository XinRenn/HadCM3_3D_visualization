<meta name="description" content="HadCM3（UM vn4.5）在三维地球上走完一个耦合日：各子程序按调用顺序作用在模式自己的网格上，场取自工业革命前启动 dump。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: the globe fills the stage; layer drawer on the left, step panel on the right,
   the coupled day runs along the bottom. One dark world (a planetarium for the model),
   so a single theme; component colours follow the v1/v2 walkthroughs. */
:root {
  --space: #060B11;
  --panel: #0C141B;
  --raise: #131F28;
  --raise-2: #1A2934;
  --line: #213240;
  --line-2: #2F4555;
  --ink: #E3EBEE;
  --muted: #95A6AE;
  --faint: #62747D;
  --accent: #E7B04C;
  --c-dyn: #6FAEE0;
  --c-rad: #E7B04C;
  --c-cloud: #C9D6E2;
  --c-conv: #A58CF2;
  --c-bl: #4FC79A;
  --c-hydro: #C99A5B;
  --c-veg: #93C45A;
  --c-gwd: #8796B0;
  --c-eng: #F06BB4;
  --c-cpl: #E5864A;
  --c-ocn: #35B6C2;
  --c-ice: #A9B9E4;
  --font-display: "Source Serif 4", "Noto Serif SC", Georgia, "Songti SC", serif;
  --font-body: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side: max(16px, env(safe-area-inset-left, 0px));
  --side-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--space); color: var(--ink); font: 13.5px/1.5 var(--font-body); overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }

.app {
  position: fixed; inset: 0;
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr) 380px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "layers stage panel" "tl tl tl";
}
.app.nolayers { grid-template-columns: 0 minmax(0, 1fr) 380px; }
.app.nolayers .layers { visibility: hidden; }

/* ---------------------------------------------------------------- header */
.top {
  grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: calc(8px + env(safe-area-inset-top, 0px)) var(--side-r) 8px var(--side);
  border-bottom: 1px solid var(--line); background: var(--panel); z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 600 21px/1.1 var(--font-display); letter-spacing: 0.01em; white-space: nowrap; }
.brand h1 span { color: var(--accent); font-family: var(--font-mono); font-size: 14px; font-weight: 500; vertical-align: 3px; margin-left: 2px; }
.brand .sub { margin: 0; color: var(--muted); font-size: 12.5px; min-width: 0; }
.tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--line-2); background: var(--raise); color: var(--ink); cursor: pointer; text-decoration: none; font-size: 12.5px;
}
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"], .tbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.lang { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.lang button { height: 28px; padding: 0 10px; border: 0; background: transparent; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--raise-2); color: var(--ink); }

/* ---------------------------------------------------------------- layer drawer */
.layers {
  grid-area: layers; overflow-y: auto; overflow-x: hidden; background: var(--panel); border-right: 1px solid var(--line);
  padding: 14px 14px 20px var(--side); z-index: 3;
}
.lg { display: grid; gap: 8px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.lg:last-child { border-bottom: 0; }
.lg h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lg label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; min-width: 0; }
.lg label.col { flex-direction: column; align-items: stretch; gap: 4px; cursor: default; }
.lg label.col > span { font-size: 12px; color: var(--muted); }
.lg select { width: 100%; height: 30px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--raise); padding: 0 6px; font-size: 12.5px; }
.lg input[type="range"] { width: 100%; accent-color: var(--accent); }
.lg input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
.lg .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.lg .hint { margin: 0; font-size: 11.5px; color: var(--faint); line-height: 1.4; }
.sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---------------------------------------------------------------- stage */
.stage { grid-area: stage; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #0B1622 0%, var(--space) 70%); min-width: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; white-space: nowrap; font: 500 11px/1.2 var(--font-mono); color: var(--ink);
  padding: 2px 5px; border-radius: 3px; background: rgba(6, 11, 17, 0.72); border-left: 2px solid var(--accent);
  transform: translate(-50%, -50%); will-change: transform;
}
.lbl.lvl { border-left-color: var(--faint); color: var(--muted); font-size: 10px; background: rgba(6, 11, 17, 0.55); }
.hud {
  position: absolute; left: 14px; top: 12px; max-width: min(460px, calc(100% - 28px)); pointer-events: none;
  display: grid; gap: 6px;
}
.hud .clock { font: 500 20px/1.15 var(--font-mono); letter-spacing: 0.01em; text-shadow: 0 1px 8px #000; }
.hud .clock small { display: block; font: 500 11.5px/1.4 var(--font-body); color: var(--muted); letter-spacing: 0.02em; }
.hud .now { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; background: rgba(6, 11, 17, 0.72); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; width: fit-content; max-width: 100%; }
.hud .now b { font-weight: 600; }
.hud .now .mono { color: var(--muted); font-size: 11px; }
.hud .loop { font: 500 12px var(--font-mono); color: var(--accent); background: rgba(6, 11, 17, 0.72); border-radius: 5px; padding: 3px 8px; width: fit-content; }
.hud .note { font-size: 12.5px; color: var(--ink); background: rgba(6, 11, 17, 0.72); border-left: 2px solid var(--accent); padding: 5px 9px; border-radius: 0 6px 6px 0; max-width: 440px; line-height: 1.45; }
.hud .acc { display: grid; gap: 3px; width: 220px; background: rgba(6, 11, 17, 0.72); border-radius: 6px; padding: 5px 8px; font-size: 11px; color: var(--muted); }
.hud .acc .bar { height: 5px; border-radius: 3px; background: var(--raise-2); overflow: hidden; }
.hud .acc .bar i { display: block; height: 100%; background: var(--c-cpl); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

.legend {
  position: absolute; left: 14px; bottom: 12px; width: 250px; pointer-events: none;
  background: rgba(6, 11, 17, 0.78); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 6px;
}
.legend .lt { font-size: 12px; font-weight: 600; line-height: 1.3; }
.legend .ls { font-size: 11px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
.legend canvas { display: block; width: 100%; height: 10px; border-radius: 2px; margin-top: 6px; }
.legend .ticks { position: relative; height: 15px; font: 10.5px/15px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.legend .cats span { display: flex; align-items: center; gap: 5px; min-width: 0; }
.tip {
  position: absolute; pointer-events: none; z-index: 4; background: rgba(6, 11, 17, 0.92); border: 1px solid var(--line-2);
  border-radius: 6px; padding: 6px 8px; font-size: 11.5px; line-height: 1.45; min-width: 150px; max-width: 260px;
}
.tip b { font-family: var(--font-mono); font-weight: 500; }
.tip .k { color: var(--muted); }
.loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; background: var(--space); z-index: 6; color: var(--muted); }
.loading .spin { width: 34px; height: 34px; border: 3px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: rot 0.9s linear infinite; }
.loading.err .spin { display: none; }
.loading.err p { color: #F2A07B; max-width: 420px; text-align: center; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------------------------------------------------------------- step panel */
.panel { grid-area: panel; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 16px var(--side-r) 24px 18px; min-width: 0; }
.panel > * + * { margin-top: 14px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.chip.mod { color: var(--ink); }
.panel h2 { margin: 0; font: 600 19px/1.25 var(--font-display); text-wrap: balance; }
.call { font: 11.5px/1.5 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.proc { border: 1px solid var(--line-2); border-radius: 8px; background: var(--raise); padding: 10px 12px; display: grid; gap: 6px; }
.proc .ph { display: flex; align-items: baseline; gap: 8px; }
.proc .pn { font: 600 12px var(--font-mono); color: var(--space); border-radius: 4px; padding: 0 5px; flex: none; }
.proc .pt { font-weight: 600; font-size: 14.5px; }
.proc .pr { font: 11px/1.45 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.proc p { margin: 0; font-size: 13px; color: var(--ink); }
.proc .tag { font-size: 11px; color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: auto; white-space: nowrap; }
.proc .tag.off { color: var(--faint); }
.sec h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.vis { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.vis li { font-size: 12.5px; line-height: 1.45; padding-left: 14px; position: relative; color: var(--ink); }
.vis li::before { content: ""; position: absolute; left: 2px; top: 0.55em; width: 6px; height: 6px; border-radius: 1px; background: var(--accent); }
.rw { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rw ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.rw li { font-size: 12px; line-height: 1.4; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.rw li .dot { transform: translateY(1px); }
.rw li span { min-width: 0; overflow-wrap: anywhere; }
.pchips { display: flex; flex-wrap: wrap; gap: 5px; }
.pchip { font: 11px/1.5 var(--font-mono); background: var(--raise-2); border-radius: 4px; padding: 1px 6px; cursor: help; }
.pchip b { color: var(--accent); font-weight: 500; margin-left: 5px; }
.plist { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.plist button {
  width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; text-align: left; align-items: baseline;
  border: 0; background: transparent; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 12.5px; color: var(--muted);
}
.plist button:hover { background: var(--raise); color: var(--ink); }
.plist button.cur { background: var(--raise-2); color: var(--ink); }
.plist button.off { opacity: 0.55; }
.plist .n { font: 500 11px var(--font-mono); text-align: right; }
.plist .r { display: block; font: 10.5px/1.4 var(--font-mono); color: var(--faint); overflow-wrap: anywhere; }
details.card { border-top: 1px solid var(--line); padding-top: 10px; }
details.card summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details.card ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
details.card li + li { margin-top: 3px; }
details.card h5 { margin: 10px 0 2px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
details.card p { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.about { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.about p { margin: 0 0 6px; }
.about a { color: var(--c-dyn); }

/* ---------------------------------------------------------------- timeline */
.timeline {
  grid-area: tl; background: var(--panel); border-top: 1px solid var(--line);
  padding: 8px var(--side-r) calc(8px + env(safe-area-inset-bottom, 0px)) var(--side); display: grid; gap: 6px; z-index: 4; min-width: 0;
}
.tl-row { min-width: 0; }
.tl-ctrl { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tc { height: 30px; min-width: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--raise); cursor: pointer; font-size: 12.5px; }
.tc.play { min-width: 74px; border-color: var(--accent); color: var(--accent); font-weight: 600; }
.speed, .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: 6px; }
.speed select { height: 28px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--raise); padding: 0 4px; }
.chk input { accent-color: var(--accent); }
.clockline { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.day { display: flex; align-items: flex-end; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.seg { display: grid; gap: 3px; flex: none; }
.seg .sl { font-size: 10.5px; color: var(--faint); letter-spacing: 0.04em; white-space: nowrap; }
.seg .ticks { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
.tk { width: 7px; height: 16px; border: 0; padding: 0; border-radius: 2px; background: var(--raise-2); cursor: pointer; flex: none; }
.tk.atm { background: #24425A; }
.tk.rad { height: 24px; background: #6B5524; }
.tk.d48 { height: 24px; background: #5A3150; }
.tk.ocn { width: 10px; background: #1B4A50; }
.tk.mix { height: 24px; }
.tk.sw { width: 30px; height: 24px; font: 600 10px var(--font-mono); color: var(--ink); background: #4A3322; }
.tk.misc { width: 30px; height: 24px; font: 500 10px var(--font-mono); color: var(--muted); }
.tk:hover { filter: brightness(1.5); }
.tk.done { filter: brightness(1.25); }
.tk.cur { outline: 2px solid var(--accent); outline-offset: 1px; filter: brightness(1.8); }
.chips { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.sc {
  flex: none; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 5px;
  border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 11.5px; color: var(--muted); white-space: nowrap;
}
.sc:hover { color: var(--ink); border-color: var(--line-2); }
.sc.cur { color: var(--ink); border-color: var(--accent); background: var(--raise); }
.sc.past { color: var(--faint); }
.sc .dot { width: 7px; height: 7px; }

/* ---------------------------------------------------------------- narrower screens */
@media (max-width: 1180px) {
  .app { grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "top top" "stage panel" "tl tl"; }
  .app.nolayers { grid-template-columns: minmax(0, 1fr) 340px; }
  .layers { grid-area: stage; justify-self: start; width: 248px; z-index: 5; box-shadow: 8px 0 24px rgba(0, 0, 0, 0.45); }
  .app.nolayers .layers { display: none; }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { position: static; display: flex; flex-direction: column; min-height: 100%; }
  .stage { height: 62svh; min-height: 340px; flex: none; }
  .layers { position: static; width: auto; box-shadow: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px var(--side-r) 6px var(--side); }
  .app.nolayers .layers { display: none; }
  .panel { overflow: visible; border-left: 0; padding: 16px var(--side-r) 24px var(--side); }
  .top { order: 0; } .stage { order: 1; } .timeline { order: 2; } .panel { order: 3; } .layers { order: 4; }
  .legend { width: 200px; left: 10px; bottom: 10px; }
  .hud { left: 10px; top: 10px; }
  .hud .clock { font-size: 16px; }
  .hud .note { display: none; }
  .brand .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .loading .spin { animation-duration: 3s; }
}

</style>

<script>

window.HAD_V1 = { en: (function () {
  const ALL = ['sun','rad','dyn','moist','bl','eng','gwd','cpl','land','veg','ice','ocn'];
  const ATMOS = ['dyn','rad','moist','bl','eng','gwd','land'];
  const STEPS = [
    { cols:['init'], rows:['dyn','rad','phys','slow','cpl','ocn','ice'], nodes:ALL, cur:[], edges:[], tab:null,
      chips:['start','1 Dec 1850','runs once'],
      title:'Start-up: read the dumps, ancillaries and namelists',

  /* ================================================================ helpers */
  let MODS = [], LANG = 'en', OPEN = () => {};
  const S = {};                       // per-module render state
  const tx = o => (o && typeof o === 'object') ? (o[LANG] || o.en) : (o == null ? '' : String(o));
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const modOf = k => MODS.find(m => m.key === k);
  const compName = k => modOf(k) ? modOf(k).name : (UI[LANG].comp[k] || k);
  const famOf = (k, own) => k === 'state' ? own : (modOf(k) ? modOf(k).fam : 'neutral');

  function graph(key) {
    const m = modOf(key), net = NETS[key];
    const nodes = new Map(), edges = [];
    const params = new Map(m.params.map(r => [r[0], r]));
    net.nodes.forEach(n => nodes.set(n.id, Object.assign({}, n)));
    const add = (a, b, kind) => {
      if (!nodes.has(a) || !nodes.has(b)) throw new Error(`HadNet ${key}: unknown node in edge ${a}>${b}`);
      if (!edges.some(e => e.a === a && e.b === b)) edges.push({ a, b, kind });
    };
    net.seq.split(';').forEach(ch => { const ids = ch.split('>').map(s => s.trim()); for (let i = 0; i < ids.length - 1; i++) add(ids[i], ids[i + 1], 'seq'); });
    net.e.trim().split(/\s+/).forEach(tok => { const [l, r] = tok.split('>'); l.split(',').forEach(a => r.split(',').forEach(b => add(a, b, 'data'))); });
    let num = 0;
    net.nodes.forEach(n => { if (n.k === 'proc') nodes.get(n.id).num = ++num; });
    /* one dashed parameter box per process, listing every parameter that process uses */
    net.nodes.filter(n => n.k === 'proc' && n.p && n.p.length).forEach(n => {
      const rows = n.p.map(name => {
        if (!params.has(name)) throw new Error(`HadNet ${key}: parameter ${name} not in the page table`);
        return params.get(name);
      });
      const id = 'G:' + n.id;
      nodes.set(id, { id, k: 'par', of: n.id, rows });
      add(id, n.id, 'par');
    });
    return { m, nodes, edges };
  }

  /* text measuring and wrapping */
  const ctx = document.createElement('canvas').getContext('2d');
  function fonts() {
    const body = getComputedStyle(document.body).fontFamily;
    const mono = getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim() || 'monospace';
    return { t: `600 13px ${body}`, b: `12.5px ${body}`, s: `11px ${body}`, m: `11px ${mono}`, mb: `500 11px ${mono}` };
  }
  function wrap(text, font, max) {
    ctx.font = font;
    const toks = String(text).match(/[⺀-鿿豈-﫿＀-￯]|[^\s⺀-鿿豈-﫿＀-￯]+|\s+/g) || [''];
    const lines = []; let cur = '';
    toks.forEach(t => {
      const tryLine = cur + t;
      if (cur.trim() && ctx.measureText(tryLine.trimEnd()).width > max) { lines.push(cur.trimEnd()); cur = t.trimStart(); }
      else cur = tryLine;
    });
    if (cur.trim() || !lines.length) lines.push(cur.trim());
    return lines.map(s => ({ s, w: ctx.measureText(s).width }));
  }

  /* node boxes: lines of {s, w, cls, h} */
  function box(n, F, own) {
    const L = [];
    const push = (arr, cls, h) => arr.forEach(x => L.push({ s: x.s, w: x.w, cls, h }));
    let padL = 10, padR = 10, min = 60;
    if (n.k === 'proc') {
      padL = 34; padR = 12; min = 120;
      push(wrap(tx(n.t), F.t, 190), 't1', 17);
      push(wrap(n.r, F.m, 205), 'mono', 14);
      const tag = [n.loop ? tx(n.loop) : '', n.cond ? tx(n.cond) : ''].filter(Boolean).join(' · ');
      if (tag) push(wrap(tag, F.s, 205), 'tag', 14);
    } else if (n.k === 'par') {
      padL = 8; padR = 8; min = 40;
      n.rows.forEach(r => {
        const v = r[3] || r[1];
        ctx.font = F.mb; const w1 = ctx.measureText(r[0]).width;
        ctx.font = F.m; const w2 = ctx.measureText(' = ' + v).width;
        L.push({ s: r[0], w: Math.min(w1 + w2, 250), cls: 'pname', h: 16, val: v, p: r });
      });
    } else {
      push(wrap(tx(n.t), F.b, 160), 'lab', 16);
      if (n.k === 'in' || n.k === 'out') push(wrap(`${n.k === 'in' ? '↘ ' + UI[LANG].from : '↗ ' + UI[LANG].to} ${compName(n.c)}`, F.s, 160), 'cap', 14);
    }
    const w = Math.max(min, Math.ceil(Math.max(...L.map(l => l.w)) + padL + padR));
    const h = Math.ceil(L.reduce((a, l) => a + l.h, 0) + (n.k === 'par' ? 8 : 14));
    return { w, h, L, padL, fam: n.k === 'proc' ? (n.fam || own) : (n.k === 'in' || n.k === 'out') ? famOf(n.c, own) : 'neutral' };
  }

  /* smooth path through dagre points */
  function pathD(p) {
    if (p.length < 3) return `M${p[0].x},${p[0].y}L${p[p.length - 1].x},${p[p.length - 1].y}`;
    let d = `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
      d += `C${(b.x + (c.x - a.x) / 6).toFixed(1)},${(b.y + (c.y - a.y) / 6).toFixed(1)} ${(c.x - (e.x - b.x) / 6).toFixed(1)},${(c.y - (e.y - b.y) / 6).toFixed(1)} ${c.x.toFixed(1)},${c.y.toFixed(1)}`;
    }
    return d;
  }

  /* ================================================================ panel HTML */
  function panel(m) {
    if (!NETS[m.key]) return '';
    const U = UI[LANG];
    const leg = U.legend.map(([k, t]) => `<span class="nl-${k}"><i></i>${t}</span>`).join('');
    let G; try { G = graph(m.key); } catch (err) { return `<p class="net-nolib">${esc(err.message)}</p>`; }
    S[m.key] = { G, drawn: false, scale: 1, fit: true, pin: null };
    const used = {};
    G.nodes.forEach(n => { if (n.k === 'par') { const pr = G.nodes.get(n.of); n.rows.forEach(r => (used[r[0]] = used[r[0]] || []).push(pr)); } });
    const rows = m.params.map(r => `<tr data-p="${esc(r[0])}" tabindex="0"><td class="k">${r[0]}</td><td class="v">${r[1]}</td><td class="u">${(used[r[0]] || []).map(n => `<span class="ul"><span class="ub">${n.num}</span>${esc(tx(n.t))}</span>`).join('')}</td><td>${r[2]}</td></tr>`).join('');
    return `<div class="netbox" data-key="${m.key}">
      <div class="net-top"><div class="net-legend">${leg}</div>
        <div class="net-tools"><button type="button" class="btn sm" data-z="out" aria-label="${U.zoomOut}">−</button><button type="button" class="btn sm" data-z="fit">${U.fit}</button><button type="button" class="btn sm" data-z="in" aria-label="${U.zoomIn}">+</button></div></div>
      <p class="mf-hint">${U.hint}</p>
      <div class="net-stage"><div class="net-scroll"><div class="net" id="net-${m.key}"></div></div>
        <aside class="net-card" aria-live="polite"><p class="nc-empty">${U.empty}</p></aside></div>
    </div>
    <div class="tablewrap"><table class="ptab"><thead><tr>${U.thead.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  /* ================================================================ drawing */
  function draw(key) {
    const st = S[key]; if (!st || st.drawn) return;
    const host = document.getElementById('net-' + key); if (!host) return;
    if (!window.dagre) { host.innerHTML = `<p class="net-nolib">${UI[LANG].nolib}</p>`; return; }
    const { G, m } = { G: st.G, m: st.G.m };
    const F = fonts();
    const g = new dagre.graphlib.Graph();
    g.setGraph({ rankdir: 'TB', nodesep: 14, ranksep: 30, edgesep: 8, marginx: 14, marginy: 14 });
    g.setDefaultEdgeLabel(() => ({}));
    const B = new Map();
    G.nodes.forEach(n => { const b = box(n, F, m.fam); B.set(n.id, b); g.setNode(n.id, { width: b.w, height: b.h }); });
    G.edges.forEach(e => g.setEdge(e.a, e.b, { weight: e.kind === 'seq' ? 8 : e.kind === 'par' ? 2 : 1, minlen: 1 }));
    dagre.layout(g);
    const W = Math.ceil(g.graph().width), H = Math.ceil(g.graph().height);
    const id = s => `${key}-${s}`;
    let h = `<svg class="netsvg" viewBox="0 0 ${W} ${H}" data-w="${W}" data-h="${H}" role="group" aria-label="${esc(m.name)}">`;
    h += `<defs>${['a', 's', 'h'].map(k => `<marker id="${id(k)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-${k}"/></marker>`).join('')}</defs>`;
    h += '<g class="edges">';
    G.edges.forEach((e, i) => {
      const pts = g.edge(e.a, e.b).points;
      h += `<g class="ne ${e.kind}" data-a="${esc(e.a)}" data-b="${esc(e.b)}"><path d="${pathD(pts)}" marker-end="url(#${id(e.kind === 'seq' ? 's' : 'a')})"/></g>`;
    });

      const on = !!nid && (el.dataset.a === nid || el.dataset.b === nid);
      el.classList.toggle('lit', on);
      const p = el.querySelector('path');
      p.setAttribute('marker-end', `url(#${key}-${on ? 'h' : el.classList.contains('seq') ? 's' : 'a'})`);
    });

    const el = document.querySelector(`.netbox[data-key="${key}"] .net-card`); if (!el) return;
    if (!nid) { el.innerHTML = `<p class="nc-empty">${U.empty}</p>`; return; }

    const name = x => x.k === 'par' ? `${U.kinds.par} · ${G.nodes.get(x.of).num}. ${tx(G.nodes.get(x.of).t)}` : x.k === 'proc' ? `${x.num}. ${tx(x.t)}` : tx(x.t);
    const link = x => `<button type="button" class="nc-link k-${x.k}" data-go="${esc(x.id)}">${esc(name(x))}</button>`;
    const ins = G.edges.filter(e => e.b === nid).map(e => G.nodes.get(e.a));
    const outs = G.edges.filter(e => e.a === nid).map(e => G.nodes.get(e.b));
    const list = (title, arr) => arr.length ? `<div class="nc-sec"><h5>${title}</h5>${arr.map(link).join('')}</div>` : '';

    const box = document.querySelector(`.netbox[data-key="${key}"]`), host = document.getElementById('net-' + key);

      const op = e.target.closest('[data-open]'); if (op) { OPEN(op.dataset.open); return; }

  window.HadNet = { init, panel, show, NETS, graph, _box: box, _wrap: wrap };
})();

  if (VIEW.towers) out.push(tx(L('Convective cloud from base level to top level (0/14, 0/15), width ∝ amount (0/13): start dump', '对流云从云底层到云顶层（0/14、0/15），宽度 ∝ 云量（0/13）：启动 dump')));
  if (VIEW.winds) out.push(fmt(L('Wind particles on level {k} (≈ {p} hPa): u, v from the start dump (0/2, 0/3)', '风场粒子：第 {k} 层（约 {p} hPa），启动 dump 的 u、v（0/2、0/3）'), { k: VIEW.winds, p: fmtP(levelP(VIEW.winds)) }));

  if (FX.spikes) out.push(tx(L('Spikes: November-mean sensible (orange) and latent (cyan) heat flux (3/217, 3/234)', '竖线：11 月平均感热（橙）和潜热（青）通量（3/217、3/234）')));
  if (FX.stressA) out.push(tx(L('Arrows: wind stress on the atmosphere grid, 30 Nov daily mean (3/219, 3/220)', '箭头：大气网格上的风应力，11 月 30 日日平均（3/219、3/220）')));
  if (FX.stressO) out.push(tx(L('Arrows: wind stress as the ocean received it, on the ocean grid (0/150, 0/151)', '箭头：海洋收到的风应力，海洋网格（0/150、0/151）')));
  if (VIEW.runoff) out.push(tx(L('Arcs: runoff from each land box to its coastal outflow point (0/93), November-mean rate', '弧线：每个陆地格点的径流到它的入海点（0/93），11 月平均径流率')));
  if (FX.gwd) out.push(tx(L('Columns: land boxes with sub-grid orography above 380 m (0/34), where the drag is largest', '竖柱：次网格地形标准差大于 380 m 的陆地格点（0/34），拖曳在这些地方最大')));
  if (FX.rays) out.push(tx(L('Rays: sunlight onto the day side; the share reflected follows the November-mean planetary albedo', '光线：照向白天一侧的太阳光；反射比例按 11 月平均行星反照率')));
  if (FX.lw) out.push(tx(L('Dashes: outgoing longwave from the model top, density ∝ November-mean OLR (2/205)', '短线：从模式顶射出的长波，密度 ∝ 11 月平均 OLR（2/205）')));
  if (FX.sunpos || FX.rays) out.push(tx(L('Sun, terminator and subsolar point for the model time, from the date and the orbit', '太阳、晨昏线和直射点：由日期和轨道算出的模式时刻位置')));
  if (FX.energy || FX.pulse) out.push(tx(FX.pulse ? L('Pulses: the three 600 s adjustment sub-steps', '脉冲：三个 600 s 调整子步') : L('Glow: one uniform increment for the whole atmosphere', '光晕：整个大气统一的增量')));
  if (FX.gsum) out.push(tx(L('Streams: every column contributes to one global sum', '流线：每个气柱都汇入同一个全球求和')));

  if (FX.bltop) out.push(tx(L('Green line: boundary-layer top (0/25)', '绿线：边界层顶（0/25）')));
  if (FX.mld) out.push(tx(L('Cyan line: ocean mixed-layer depth (0/137)', '青线：海洋混合层深度（0/137）')));

  if (FX.iceDrift) out.push(tx(L('White lines: November-mean ice velocity (32/209, 32/210)', '白线：11 月平均海冰速度（32/209、32/210）')));
  if (VIEW.ice) out.push(tx(L('Sea ice: concentration (0/146) and thickness (0/147), start dump', '海冰：密集度（0/146）和厚度（0/147），启动 dump')));
  if (VIEW.gridA) out.push(tx(L('White grid: atmosphere boxes, 3.75° × 2.5°', '白色网格：大气格点，3.75° × 2.5°')));
  if (VIEW.gridO) out.push(tx(L('Cyan grid: ocean boxes, 1.25° × 1.25°', '青色网格：海洋格点，1.25° × 1.25°')));

}
function rwOf(mod, p) {
  const g = graphOf(mod); if (!g) return { r: [], w: [], par: [] };
  const lab = id => g.nodes.get(id);
  const r = g.edges.filter(e => e.kind === 'data' && e.b === p).map(e => lab(e.a)).filter(Boolean);
  const w = g.edges.filter(e => e.kind === 'data' && e.a === p).map(e => lab(e.b)).filter(Boolean);
  const pn = g.nodes.get('G:' + p);
  return { r, w, par: pn ? pn.rows : [] };
}
function varItem(n, mod) {
  const c = n.k === 'in' || n.k === 'out' ? n.c : mod;
  const where = n.k === 'in' ? ` ← ${tx(COMP[c] ? COMP[c].n : c)}` : n.k === 'out' ? ` → ${tx(COMP[c] ? COMP[c].n : c)}` : '';
  return `<li><i class="dot" style="background:${compColor(c)}"></i><span>${esc(tx(n.t))}<span style="color:var(--faint)">${esc(where)}</span></span></li>`;
}
function renderPanel() {
  const st = P.list[P.si], [mod, p] = curProc(), n = procNode(mod, p), m = curMacro();
  const card = V1[LANG].STEPS[cardOf(st, p)];
  const [c1, c2] = clockText();
  let h = `<div class="chiprow"><span class="chip">${esc(c2)}</span><span class="chip">${esc(c1)}</span>${mod ? `<span class="chip mod"><i class="dot" style="background:${compColor(mod)}"></i>${esc(tx(COMP[mod].n))}</span>` : ''}</div>`;
  h += `<h2>${card ? card.title : ''}</h2>`;
  if (card) h += `<div class="call">${esc(card.call)} · ${esc(card.src)}</div>`;
  if (n) {
    const num = procNum(mod, p), tag = n.off ? `<span class="tag off">${esc(tx(U.off))}</span>` : n.cond ? `<span class="tag">${esc(tx(n.cond))}</span>` : (n.loop ? `<span class="tag">${esc(tx(n.loop))}</span>` : '');
    h += `<div class="proc"><div class="ph"><span class="pn" style="background:${compColor(n.fam || mod)}">${num}</span><span class="pt">${esc(tx(n.t))}</span>${tag}</div><div class="pr">${esc(n.r)}</div>${n.d ? `<p>${esc(tx(n.d))}</p>` : ''}</div>`;
  }
  const vis = visList();
  if (vis.length) h += `<div class="sec"><h4>${esc(tx(U.inView))}</h4><ul class="vis">${vis.map(v => `<li>${esc(v)}</li>`).join('')}</ul></div>`;
  if (n) {
    const { r, w, par } = rwOf(mod, p);
    if (r.length || w.length) h += `<div class="sec rw"><div><h4>${esc(tx(U.reads))}</h4><ul>${r.map(x => varItem(x, mod)).join('') || '<li>—</li>'}</ul></div><div><h4>${esc(tx(U.writes))}</h4><ul>${w.map(x => varItem(x, mod)).join('') || '<li>—</li>'}</ul></div></div>`;
    if (par.length) h += `<div class="sec"><h4>${esc(tx(U.params))}</h4><div class="pchips">${par.map(rw => `<span class="pchip" title="${esc(rw[2])}">${esc(rw[0])}<b>${esc(rw[3] || rw[1])}</b></span>`).join('')}</div></div>`;
  }
  if (mod && NETS[mod]) {
    h += `<div class="sec"><h4>${esc(fmt(U.procs, { m: tx(COMP[mod].n) }))}</h4><ol class="plist">${procsOf(mod).map((q, i) => `<li><button type="button" data-proc="${q.id}" class="${q.id === p ? 'cur' : ''}${q.off ? ' off' : ''}"><span class="n">${i + 1}</span><span>${esc(tx(q.t))}<span class="r">${esc(q.r)}</span></span></button></li>`).join('')}</ol></div>`;
  }

  }
  h += `<div class="about"><p><b>${esc(tx(U.about))}.</b> ${esc(tx(L(
    'Fields come from the BRIDGE standard HadCM3 (MOSES 2.1) pre-industrial start dumps tcylxa/tcylxo@dao09c1, valid 1 Dec 00:00, standing in for tdaah’s own dumps (HadCM3B-M2.1aD, not on bc5). Fields marked “start dump” are the instantaneous model state; “November mean” and “30 Nov” fields are STASH means stored in the same dumps. Nothing is integrated in the browser: the animation shows which routine runs, in which order, on which points and levels, and what it reads and writes; the fields stay as stored. Call order and source lines: UM vn4.5 decks, as in the 2D walkthrough.',
    '场取自 BRIDGE 标准 HadCM3（MOSES 2.1）工业革命前启动 dump tcylxa/tcylxo@dao09c1（12 月 1 日 00:00），代替 tdaah 自己的 dump（HadCM3B-M2.1aD，bc5 上没有）。标为“启动 dump”的场是瞬时模式状态；“11 月平均”和“11 月 30 日”的场是同一 dump 中存的 STASH 平均。浏览器里不做任何积分：动画展示的是哪个子程序在运行、顺序如何、作用在哪些格点和层上、读写了什么；场本身保持 dump 中的原样。调用顺序和源码行号取自 UM vn4.5 deck，与 2D 版一致。')))}</p></div>`;
  const el = $('#panel'); el.innerHTML = h;

}
function cardOf(st, p) {

  return st.card;
}
function jumpToProc(mod, p) {
  let i = P.list.findIndex(s => s.mod === mod && s.p === p);
  if (i < 0 && KPROCS.includes(p)) i = P.list.findIndex(s => s.p === 'KLOOP');
  if (i < 0 && ROWPROCS.includes(p)) i = P.list.findIndex(s => s.p === 'ROWS' || s.p === 'ROWSF');
  if (i >= 0) { P.si = i; P.t = 0; P.sub = null; applyStage({}); renderChips(); renderPanel(); renderHud(); return; }
  /* not in this step: find the next macro step that has it */
  for (let d = 1; d < MACRO.length; d++) {
    const mi = (P.mi + d) % MACRO.length, list = stagesOf(MACRO[mi], P.detail), k = list.findIndex(s => s.mod === mod && s.p === p);
    if (k >= 0) { go(mi, k); return; }
  }
}

/* ================================================================ timeline and chips */
function renderTimeline() {
  const el = $('#day');
  const tk = (mi, cls, label, title) => `<button type="button" class="tk ${cls}${mi === P.mi ? ' cur' : ''}${mi < P.mi ? ' done' : ''}" data-mi="${mi}" title="${esc(title)}">${label || ''}</button>`;
  let h = `<div class="seg"><span class="sl">&nbsp;</span><div class="ticks">${tk(0, 'misc', tx(U.start), tx(U.startup))}</div></div>`;
  h += `<div class="seg"><span class="sl">${esc(tx(U.atmGroup))}</span><div class="ticks">`;
  for (let s = 1; s <= 48; s++) { const mi = s; h += tk(mi, s === 48 ? 'atm d48' : (s - 1) % 6 === 0 ? 'atm rad' : 'atm', '', `${fmt(U.atmStep, { s })} · ${hh((s - 1) / 2)}–${hh(s / 2)}${(s - 1) % 6 === 0 ? ' · ' + tx(U.radStep) : ''}`); }
  h += `</div></div><div class="seg"><span class="sl">&nbsp;</span><div class="ticks">${tk(49, 'sw', tx(U.a2o), tx(U.swapA2O))}</div></div>`;
  h += `<div class="seg"><span class="sl">${esc(tx(U.ocnGroup))}</span><div class="ticks">`;
  for (let s = 1; s <= 24; s++) { const mi = 49 + s; h += tk(mi, s === 1 ? 'ocn mix' : 'ocn', '', `${fmt(U.ocnStep, { s })} · ${hh(s - 1)}–${hh(s)}`); }
  h += `</div></div><div class="seg"><span class="sl">&nbsp;</span><div class="ticks">${tk(74, 'sw', tx(U.o2a), tx(U.swapO2A))}${tk(75, 'misc', tx(U.nextDay), tx(U.dayN1))}${tk(76, 'misc', tx(U.end), tx(U.runEnd))}</div></div>`;
  el.innerHTML = h;
  el.querySelectorAll('[data-mi]').forEach(b => b.addEventListener('click', () => go(+b.dataset.mi, 0)));
}
function chipLabel(s) {
  if (s.p === 'KLOOP') return '↻ k · 4–7';
  if (s.p === 'ROWS' || s.p === 'ROWSF') return '↻ j · ROWCALC';
  if (s.p === 'init') return tx(U.startup); if (s.p === 'next') return tx(U.dayN1); if (s.p === 'end') return tx(U.runEnd);
  const n = procNode(s.mod, s.p); return n ? `${procNum(s.mod, s.p)} ${tx(n.t)}` : s.p;
}
function renderChips() {
  const el = $('#chips');
  el.innerHTML = P.list.map((s, i) => `<button type="button" class="sc${i === P.si ? ' cur' : i < P.si ? ' past' : ''}" data-si="${i}"><i class="dot" style="background:${compColor(s.mod || 'state')}"></i>${esc(chipLabel(s))}</button>`).join('');
  el.querySelectorAll('[data-si]').forEach(b => b.addEventListener('click', () => { P.si = +b.dataset.si; P.t = 0; P.sub = null; applyStage({}); renderChips(); renderPanel(); renderHud(); }));
  const cur = el.querySelector('.cur');
  if (cur) { const l = cur.offsetLeft - el.offsetLeft, w = el.clientWidth; if (l < el.scrollLeft + 20 || l > el.scrollLeft + w - 120) el.scrollLeft = Math.max(0, l - w / 3); }
  const day = $('#day'), t = day.querySelector('.cur');
  if (t) { const l = t.offsetLeft - day.offsetLeft, w = day.clientWidth; if (l < day.scrollLeft || l > day.scrollLeft + w - 40) day.scrollLeft = Math.max(0, l - w / 2); }
}

/* ================================================================ hover tooltip */
const RAY = new THREE.Raycaster(), MOUSE = new THREE.Vector2();
let TIP_EV = null;
function onHover(e) { TIP_EV = e; }
function tipTick() {
  const e = TIP_EV, tip = $('#tip'); if (!e) return; TIP_EV = null;
  if (e.type === 'pointerleave' || e.buttons) { tip.hidden = true; return; }
  const r = $('#gl').getBoundingClientRect();
  MOUSE.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  RAY.setFromCamera(MOUSE, camera);
  const o = RAY.ray.origin, d = RAY.ray.direction, b = o.dot(d), c = o.lengthSq() - 1, disc = b * b - c;
  if (disc < 0) { tip.hidden = true; return; }

  if (inCut(lon)) { tip.hidden = true; return; }
  const s = SURF[VIEW.surf], jO = clamp(Math.round((lat + 89.375) / 1.25), 0, 143), iO = Math.round(lon / 1.25) % 288, a = idxA(lat, lon), land = KMT[jO * 288 + iO] === 0;
  let val = '';
  if (s.cat) { const q = vegAt(lat, lon); val = q >= 0 ? tx(VEG[q][1]) : '—'; }
  else { const v = surfValue(s, jO, iO); const masked = (s.mask === 'ocean' && land) || (s.mask === 'land' && !land) || (s.mask === 'oceanA' && LSM[a] > 0.5); val = masked || !(v === v) ? '—' : `${fmtV(v)} ${unitsOf(s)}`; }
  let h = `<div><b>${fmtLat(lat)} ${lon.toFixed(1)}°E</b> · ${esc(tx(land ? U.tipLand : U.tipSea))}</div><div class="k">${esc(tx(U.tipA))} i=${a % 96 + 1}, j=${Math.floor(a / 96) + 1} · ${esc(tx(U.tipO))} i=${iO + 1}, j=${jO + 1}</div><div>${esc(tx(s.name))}: <b>${esc(val)}</b></div>`;
  if (VIEW.winds) { const k = VIEW.winds - 1, g = ST.grids.AU, u = bilin(F.u.lev(k), g, lat, lon), v = bilin(F.v.lev(k), g, lat, lon); h += `<div>${esc(tx(U.winds))} k=${VIEW.winds}: <b>${Math.hypot(u, v).toFixed(1)} m/s</b></div>`; }
  if (VIEW.currents && !land) { const k = VIEW.currents - 1, g = ST.grids.OU, u = bilin(F.U.lev(k), g, lat, lon), v = bilin(F.V.lev(k), g, lat, lon); if (u === u) h += `<div>${esc(tx(U.currents))}: <b>${Math.hypot(u, v).toFixed(1)} cm/s</b></div>`; }
  tip.innerHTML = h; tip.hidden = false;
  const sr = $('#stage').getBoundingClientRect(); let x = e.clientX - sr.left + 14, y = e.clientY - sr.top + 14;

}

/* ================================================================ main */
function bindControls() {
  $('#btnPlay').addEventListener('click', () => { P.playing = !P.playing; renderTransport(); });
  $('#btnPrev').addEventListener('click', () => advance(-1));
  $('#btnNext').addEventListener('click', () => advance(1));
  $('#selSpeed').addEventListener('change', e => { P.speed = +e.target.value; });
  $('#chkDetail').addEventListener('change', e => { P.detail = e.target.checked; go(P.mi, 0); });
  $('#btnHome').addEventListener('click', () => { CAMTWEEN = null; const p = xyz(20, wrap360(VIEW.cutLon + VIEW.cutW / 2), 6.2); if (!VIEW.autoCam || REDUCED) camera.position.copy(p); else CAMTWEEN = { from: camera.position.clone(), to: p, t: 0, dur: 1.2 }; });
  $('#btnSpin').addEventListener('click', e => { VIEW.spin = !VIEW.spin; controls.autoRotate = VIEW.spin; e.currentTarget.setAttribute('aria-pressed', String(VIEW.spin)); });
  $('#btnLayers').addEventListener('click', e => { const app = $('#app'), hide = !app.classList.contains('nolayers'); app.classList.toggle('nolayers', hide); e.currentTarget.setAttribute('aria-expanded', String(!hide)); setTimeout(resize, 30); });
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    LANG = b.dataset.lang; try { localStorage.setItem('had3d-lang', LANG); } catch (e) { /* storage blocked */ }
    renderStatic(); renderTimeline(); renderChips(); renderPanel(); renderHud(); renderLegend(); updateCutLabels();
  }));
  const gl = $('#gl');
  gl.addEventListener('pointermove', onHover); gl.addEventListener('pointerleave', onHover); gl.addEventListener('pointerdown', () => { $('#tip').hidden = true; });
  window.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    if (e.key === ' ') { e.preventDefault(); P.playing = !P.playing; renderTransport(); }
    else if (e.key === 'ArrowRight') advance(1); else if (e.key === 'ArrowLeft') advance(-1);
  });
  if (window.innerWidth <= 1180) { $('#app').classList.add('nolayers'); $('#btnLayers').setAttribute('aria-expanded', 'false'); }
}
async function main() {
  const msg = $('#loadMsg'); msg.textContent = tx(U.loading);
  if (!ST) { $('#loading').classList.add('err'); msg.textContent = tx(U.nodata); return; }
  try { const c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) throw new Error('nogl'); }
  catch (e) { $('#loading').classList.add('err'); msg.textContent = tx(U.nogl); return; }
  await loadData();
  initAxes();
  setWetLevel(1);
  initScene();
  bindControls();
  renderStatic();
  go(0, 0);
  $('#loading').hidden = true;
  HOOKS.init.forEach(f => f());
  let last = performance.now();
  const loop = (t, frame) => {
    const dt = Math.min((t - last) / 1000, 0.1); last = t;
    animate(dt, t / 1000);
    if (!HOOKS.presenting()) { controls.update(); updateLabels(); tipTick(); }
    HOOKS.frame.forEach(f => f(dt, t / 1000, frame));
    renderer.render(HOOKS.scene ? HOOKS.scene() : scene, camera);
  };
  renderer.setAnimationLoop(loop);   /* the same as requestAnimationFrame outside WebXR; the headset's frame loop inside it */
  window.HAD3D = { P, VIEW, go, F, FX, camera, scene, renderer, MACRO, advance, LINES, OBJ,
    settle() { if (CAMTWEEN) { camera.position.copy(CAMTWEEN.to); CAMTWEEN = null; } REGRID.t = 99; } };
}
main().catch(e => { console.error(e); const l = $('#loading'); l.hidden = false; l.classList.add('err'); $('#loadMsg').textContent = String(e && e.message || e); });

</script>
